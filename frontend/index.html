<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Product Shop</title>
</head>
<body>
<div id="navbar"></div>

<button onclick="loadProducts()">Load Products</button>
<ul id="product-list"></ul>

<h2>🛒 Cart</h2>
<ul id="cart-list"></ul>
<button onclick="purchase()">Purchase</button>


<script src="js/utils.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch("nav.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            })
            .catch(error => console.error('Error loading navbar:', error));
    });

    let cart = {}; // { product_id: quantity }
    const productCache = {}; // { product_id: product object }
    const token = getToken()


    async function loadProducts() {
        const list = document.getElementById("product-list");
        list.innerHTML = "";

        try {
            const res = await fetch("http://localhost:8000/products/", {
                headers: {Authorization: `Bearer ${token}`}
            });

            const products = await res.json();

            products.forEach(p => {
                productCache[p.id] = p; // Cache product for later use

                const li = document.createElement("li");
                li.textContent = `${p.name} - $${p.price.toFixed(2)} `;

                const btn = document.createElement("button");
                btn.textContent = "Add to Cart";
                btn.onclick = () => addToCart(p);
                li.appendChild(btn);

                list.appendChild(li);
            });

        } catch (e) {
            list.innerHTML = `<li>Error: ${e.message}</li>`;
        }
    }

    function addToCart(product) {
        cart[product.id] = (cart[product.id] || 0) + 1;
        renderCart();
    }

    function renderCart() {
        const cartList = document.getElementById("cart-list");
        cartList.innerHTML = "";

        for (const [id, quantity] of Object.entries(cart)) {
            const product = productCache[id];
            const li = document.createElement("li");
            li.textContent = `${product.name} × ${quantity}`;
            cartList.appendChild(li);
        }
    }

    async function purchase() {
        const items = Object.entries(cart).map(([product_id, quantity]) => {
            const product = productCache[product_id];
            return {
                product_id,
                quantity,
                unit_price: product.price  // ✅ include unit_price
            };
        });

        const body = {
            items,
            shipping_address: "123 Developer Lane",
            shipping_city: "Codeville",
            shipping_postal_code: "12345",
            shipping_country: "Devland"
        };

        try {
            const res = await fetch("http://localhost:8000/orders/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });

            const result = await res.json();
            alert("Purchase complete! Order ID: " + result.id);
            cart = {};
            renderCart();

        } catch (e) {
            alert("Purchase failed: " + e.message);
        }
    }
</script>

</body>
</html>
